{% extends "main/base.html" %}
{% load crispy_forms_tags %}

{% block content %}
<div class="container mt-5">
    <h1 class="text-center mb-4">Edit Job Post</h1>

    <div class="card shadow-sm">
        <div class="card-body">
            <form method="POST">
                {% csrf_token %}
                {{ form|crispy }}  <!-- Using Crispy Forms for styling -->
                <button type="submit" class="btn btn-primary">Update Job Post</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
